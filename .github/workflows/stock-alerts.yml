name: Stock Alerts

on:
  schedule:
    # Every 10 minutes. GitHub may run this a few minutes late during high load — that's normal.
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, for testing

permissions:
  contents: write # needed so the workflow can commit the updated alert_state.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Keep these in sync with the settings you actually use on the page.
      PRICE_CAP: "15"
      CHANGE_THRESHOLD: "5"
      VOL_RATIO_THRESHOLD: "1.5"
      MIN_VOLUME: "100000"
      REQUIRE_MA: "true"
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for bullish movers
        run: python scripts/check_alerts.py

      - name: Commit updated alert state
        run: |
          git config user.name "stock-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/alert_state.json
          git diff --cached --quiet || git commit -m "Update alert state [skip ci]"
          git push
